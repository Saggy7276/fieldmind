name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "fieldmind-ui/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fieldmind-ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fieldmind-ui/package-lock.json
      # npm install, not npm ci: the lock file is written on Windows and lacks the
      # Linux-only optional packages of Vite's bundler (npm/cli#4828).
      # The CUDA download of onnxruntime-node (used only by scripts/parity.mjs) is skipped.
      - run: npm install --no-audit --no-fund --onnxruntime-node-install-cuda=skip
      - run: npm run lint
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fieldmind-ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
